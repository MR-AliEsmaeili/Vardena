# TLS terminates at the Owner ingress; OWNER_PUBLIC_ORIGIN must be its HTTPS origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://owner-api:3001;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        client_max_body_size 16k;
    }
    location / { try_files $uri $uri/ /index.html; }
}
