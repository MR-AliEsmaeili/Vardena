# Vardena v1 stack: PostgreSQL + API + worker (docs/architecture.md section 10).
# Secrets come from the environment (root .env, see .env.example) — never
# committed (AG-12). Start with:  docker compose up --build
name: vardena

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vardena}
      POSTGRES_USER: ${POSTGRES_USER:-vardena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example).}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vardena} -d ${POSTGRES_DB:-vardena}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (see .env.example).}
      CHECKPOINT_DISABLE: "1"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (see .env.example).}
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (see .env.example).}
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
