# Vardena CI: two independent jobs.
#
# `backend`  — quality gates + unit tests + build + e2e (incl. live-DB suites).
# `frontend` — quality gates + component/logic tests + production build.
#
# The frontend job deliberately does NOT duplicate the backend's live-DB
# integration coverage: it never starts Postgres and never boots the API.
# Frontend verification is hermetic (the `src/api/*` modules are stubbed in
# tests), so the two jobs run in parallel and stay independently meaningful.
#
# Backend pipeline order mirrors backend/README.md "Tests" / "quality gates":
#   prisma validate -> generate -> lint -> typecheck -> format:check
#   -> unit -> build -> migrate deploy -> system-admin bootstrap -> e2e
#      (with VARDENA_TEST_DATABASE_URL)
#
# Notes:
# - npm is upgraded to v11 first: npm 10's resolver crashes on this
#   dependency graph ("Exit handler never called!" — see backend/README.md
#   Requirements and backend/Dockerfile).
# - The job-level DATABASE_URL is intentionally unreachable (same value as
#   backend/vitest.config.e2e.ts): `prisma generate`/`validate` need the key
#   present but never connect, unit tests are hermetic, and the non-live e2e
#   specs assert the deterministic readiness/503 path. Only the
#   `migrate deploy` step and the live-DB suites (via
#   VARDENA_TEST_DATABASE_URL) talk to the Postgres service.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vardena_test
          POSTGRES_USER: vardena
          POSTGRES_PASSWORD: vardena_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vardena -d vardena_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vardena:invalid@127.0.0.1:1/vardena_test
      VARDENA_TEST_DATABASE_URL: postgresql://vardena:vardena_test_password@localhost:5432/vardena_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Upgrade npm to v11
        run: npm install -g npm@11

      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Prisma validate
        working-directory: backend
        run: npm run prisma:validate

      - name: Prisma generate
        working-directory: backend
        run: npm run prisma:generate

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Format check
        working-directory: backend
        run: npm run format:check

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Migrate test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://vardena:vardena_test_password@localhost:5432/vardena_test
        run: npm run prisma:deploy

      - name: Bootstrap system administrator
        working-directory: backend
        env:
          DATABASE_URL: postgresql://vardena:vardena_test_password@localhost:5432/vardena_test
        run: npm run bootstrap:system-admin

      # The populated pre-Task-11 backfill cannot be observed on a database that
      # was migrated from empty, so this step proves it the only way possible:
      # a disposable database created from the service, the 12 pre-Task-11
      # migrations, the seeded fixture (multi-org, one-level, orphan, draft and
      # superseded-only organizations), the Task 11 migration applied in one
      # transaction under a lock probe, then verify.sql's assertions. On success
      # the database is dropped; on failure it is left in place and the step
      # fails, so a regression is visible without reading logs.
      - name: Migration rehearsal (populated pre-Task-11 data)
        working-directory: backend
        env:
          VARDENA_REHEARSAL_ADMIN_URL: postgresql://vardena:vardena_test_password@localhost:5432/postgres
        run: npm run test:migration-rehearsal

      - name: E2E tests (incl. live-DB suites)
        working-directory: backend
        timeout-minutes: 10
        # `pipefail` so a failing suite still fails the step through the pipe,
        # and the tee'd log is what the "Upload backend logs on failure" step
        # below actually collects: without a file on disk that step has always
        # been a no-op, and a live-database failure was undiagnosable from CI.
        run: |
          set -o pipefail
          mkdir -p test-results
          timeout 540 npm run test:e2e 2>&1 | tee test-results/e2e.log

      # DIAGNOSTIC ONLY — changes no test, no assertion and no product code.
      # GitHub auto-detects at most ten annotations per job, so when several
      # live-DB suites fail at once the rest of the failure inventory is
      # invisible through the API (the log itself can only be read from the
      # artifact, whose host is unreachable from the agent sandbox). Emitting
      # the failure inventory explicitly surfaces every failing suite and test
      # in one place. Never gates the job: it only runs after a failure.
      - name: Publish e2e failure inventory
        if: failure()
        working-directory: backend
        run: |
          python3 - <<'PY' || true
          import re, sys
          path = 'test-results/e2e.log'
          try:
              lines = open(path, encoding='utf-8', errors='replace').read().splitlines()
          except OSError:
              print('no e2e log to summarise')
              raise SystemExit(0)

          keep = []
          for i, line in enumerate(lines):
              if line.startswith(' FAIL ') or line.startswith('FAIL '):
                  keep.append(line.strip())
              elif re.search(
                  r'(AssertionError|Error:|Exception|P2002|P2003|P2010|P2024|'
                  r'unique constraint|foreign key|duplicate key|deadlock|'
                  r'timed out|Test Files|Tests  )',
                  line,
              ):
                  keep.append(line.rstrip())
          if not keep:
              keep = ['no recognisable failure lines; log tail:']
              keep += lines[-40:]

          # The vitest summary lines are the most load-bearing: emit them first.
          def rank(text):
              return 0 if 'Test Files' in text or re.match(r'^\s*Tests\s', text) else 1
          keep.sort(key=rank)

          body = '\n'.join(keep)
          chunks = [body[i:i + 20000] for i in range(0, len(body), 20000)][:8]
          for n, chunk in enumerate(chunks, 1):
              print('::error title=E2E failure inventory (%d/%d)::%s'
                    % (n, len(chunks), chunk.replace('\n', '%0A')))

          # A run killed by `timeout 540` ends without vitest's summary block,
          # which truncates this inventory and is itself the finding.
          summary = any('Test Files' in line for line in lines)
          print('::error title=E2E log shape::%s'
                % ('lines=%d summary_block=%s' % (len(lines), summary)
                   ).replace('\n', '%0A'))
          PY

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-logs
          if-no-files-found: ignore
          path: |
            backend/**/*.log
            backend/test-results/**
            /tmp/vardena-*.log

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade npm to v11
        run: npm install -g npm@11

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
