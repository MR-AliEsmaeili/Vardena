name: debug-migrate
on:
  push:
    branches: [arena/01a0ca12-vardena]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  debug:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vardena_test
          POSTGRES_USER: vardena
          POSTGRES_PASSWORD: vardena_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vardena -d vardena_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Prisma migrate deploy (capture)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://vardena:vardena_test_password@localhost:5432/vardena_test
        run: |
          set +e
          npm run prisma:deploy 2>&1 | tee /tmp/migrate.log
          EXIT=${PIPESTATUS[0]}
          echo "EXIT:$EXIT" | tee -a /tmp/migrate.log
          cat /tmp/migrate.log
          # also try to show migration status
          npx prisma migrate status 2>&1 | tee -a /tmp/migrate.log || true
          exit $EXIT
      - name: Post result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '';
            try { out = fs.readFileSync('/tmp/migrate.log', 'utf8'); } catch(e) { out = 'no log: ' + e.message; }
            out = out.slice(0, 60000);
            const body = `**debug-migrate** run \`${{ github.run_id }}\` \n\`\`\`\n${out}\n\`\`\``;
            const prs = await github.rest.pulls.list({owner: context.repo.owner, repo: context.repo.repo, head: `${context.repo.owner}:arena/01a0ca12-vardena`, state: 'open'});
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: prs.data[0].number, body});
            }
